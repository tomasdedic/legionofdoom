<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ranger</title>
<style>
	:root {
		--bg: #0c0d10;
		--panel: #16181d;
		--line: #262a31;
		--fg: #dfe3ea;
		--dim: #8b93a1;
		--acc: #6bd6a4;
		--warn: #ffb454;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
	header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 10px; z-index: 2; }
	.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
	#meta { color: var(--dim); font-size: 12px; }
	.chip, button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; }
	.chip[aria-current="true"] { border-color: var(--acc); color: var(--acc); }
	main { padding: 10px 10px 140px; display: flex; flex-direction: column; gap: 10px; }
	.msg { border-left: 2px solid var(--line); padding: 2px 0 2px 9px; }
	.msg.user { border-color: var(--acc); }
	.msg.err { border-color: var(--warn); color: var(--warn); }
	.who { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
	pre { margin: 3px 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
	.tool { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; }
	.tool b { color: var(--acc); }
	details summary { color: var(--dim); font-size: 12px; }
	details[open] summary { color: var(--fg); }
	footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
	#input { width: 100%; min-height: 52px; max-height: 40vh; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; resize: vertical; }
	#send { border-radius: 12px; padding: 10px 16px; }
	#send.busy { border-color: var(--warn); color: var(--warn); }
	label { color: var(--dim); font-size: 12px; }
	#model { flex: 1; min-width: 0; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
</style>
<header>
	<div class="row" id="convs"></div>
	<div class="row"><span id="meta">connecting…</span><button id="new">+ new</button><button id="reset">reset</button><button id="stop">stop</button></div>
	<div class="row"><input id="model" list="modelids" autocomplete="off" spellcheck="false" placeholder="provider/model" /><button id="setmodel">set</button><datalist id="modelids"></datalist></div>
</header>
<main id="log"></main>
<footer>
	<textarea id="input" placeholder="tell the worker what to do" autocomplete="off"></textarea>
	<div class="row" style="margin-top:6px">
		<button id="send">send</button>
		<label><input type="checkbox" id="steer" /> steer while busy</label>
		<span id="usage" style="color:var(--dim);font-size:12px"></span>
	</div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token") || "";
const q = (path) => `${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}`;
let boot, id, es, busy = false, model;
const live = { text: "", thinking: "", tools: new Map() };
let entries = [];

const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls ?? "", ...(text === undefined ? {} : { textContent: text }) });
const block = (cls, ...kids) => { const n = el("div", cls); kids.forEach((k) => n.append(k)); return n; };
const clip = (s, n = 1500) => (s.length > n ? `${s.slice(0, n)}\n… ${s.length - n} more chars` : s);
const scroll = () => { if (window.innerHeight + window.scrollY > document.body.scrollHeight - 240) window.scrollTo({ top: document.body.scrollHeight }); };

function msgOf(entry) {
	const m = Array.isArray(entry.model) ? entry.model[0] : entry.model;
	return m ?? { role: "note" };
}

function renderEntry(entry) {
	const m = msgOf(entry);
	if (entry.kind === "pi.system" || m.role === "system") return null;
	if (entry.kind === "pi.reset") return block("msg", el("div", "who", "— reset —"));
	if (entry.kind === "pi.compaction") return block("msg", el("div", "who", "— compacted —"));
	if (m.role === "note" || entry.kind === "app.error") return block("msg err", el("div", "who", "ranger"), el("pre", undefined, String(m.content ?? "")));
	if (m.role === "user") return block("msg user", el("div", "who", "you"), el("pre", undefined, String(m.content ?? "")));
	if (m.role === "toolResult") {
		const text = (Array.isArray(m.content) ? m.content : []).map((c) => c.text ?? "").join("\n");
		return block("msg", el("div", "who", `${m.isError ? "✗ " : ""}${m.toolName ?? "tool"} output`), toolDetails(clip(text) || "(no output)"));
	}
	const box = block("msg", el("div", "who", m.provider ? `${m.provider}/${m.model}` : "worker"));
	if (m.stopReason === "error") {
		box.className = "msg err";
		box.append(el("div", "who", "model error"), el("pre", undefined, String(m.errorMessage ?? "unknown error")));
		return box;
	}
	for (const c of Array.isArray(m.content) ? m.content : []) {
		if (c.type === "text") box.append(el("pre", undefined, c.text ?? ""));
		else if (c.type === "thinking") box.append(block("tool", el("div", "who", "thinking"), el("pre", undefined, clip(c.thinking ?? ""))));
		else if (c.type === "toolCall") box.append(block("tool", el("pre", undefined, `$ ${c.name} ${JSON.stringify(c.arguments ?? {})}`)));
	}
	return box;
}

function toolDetails(text) {
	const d = document.createElement("details");
	d.append(Object.assign(document.createElement("summary"), { textContent: text.split("\n")[0].slice(0, 70) || "output" }));
	d.append(el("pre", undefined, text));
	return d;
}

function paint() {
	const log = $("log");
	log.replaceChildren();
	for (const entry of entries) { const node = renderEntry(entry); if (node) log.append(node); }
	if (busy) {
		const tail = block("msg", el("div", "who", "working…"));
		if (live.thinking) tail.append(block("tool", el("div", "who", "thinking"), el("pre", undefined, clip(live.thinking))));
		if (live.text) tail.append(el("pre", undefined, live.text));
		for (const tool of live.tools.values()) tail.append(block("tool", el("pre", undefined, `$ ${tool.name} ${JSON.stringify(tool.args ?? {})}`), tool.out ? toolDetails(clip(tool.out)) : el("pre", undefined, "running…")));
		log.append(tail);
	}
	scroll();
}

function status(text, color) {
	const meta = $("meta");
	meta.textContent = text;
	meta.style.color = color ?? "var(--dim)";
	$("send").classList.toggle("busy", busy);
	$("send").textContent = busy ? "steer/follow-up" : "send";
}

function onEvent(e) {
	switch (e.type) {
		case "snapshot":
			entries = [...e.entries];
			model = e.agent?.model ?? model; // per-conversation: this is what the next turn actually runs
			if (model) $("model").value = `${model.provider}/${model.modelId}`;
			if (e.generation?.message) live.text = (e.generation.message.content ?? []).filter((c) => c.type === "text").map((c) => c.text).join("");
			for (const t of e.tools ?? []) live.tools.set(t.toolCallId ?? t.id, { name: t.name ?? t.toolName, args: t.args ?? t.arguments, out: t.output ?? "" });
			busy = Boolean(e.run);
			break;
		case "run_start": busy = true; break;
		case "run_end": busy = false; live.text = ""; live.thinking = ""; live.tools.clear(); break;
		case "message_start": if (e.message.role === "assistant") { live.text = ""; live.thinking = ""; } break;
		case "message_end": entries.push(e.entry); live.text = ""; live.thinking = ""; break;
		case "message_update":
			for (const c of e.changes ?? []) {
				if (c.type === "text_delta") live.text += c.delta;
				else if (c.type === "thinking_delta") live.thinking += c.delta;
				else if (c.type === "message") { entries.push({ kind: "pi.assistant", model: [c.message] }); live.text = ""; }
			}
			break;
		case "tool_execution_start": live.tools.set(e.toolCallId, { name: e.toolName, args: e.args, out: "" }); break;
		case "tool_execution_update": {
			const tool = live.tools.get(e.toolCallId) ?? { name: e.toolName, args: {}, out: "" };
			tool.out = e.output?.set ?? (e.output ? `${String(tool.out).slice(e.output.trimStart ?? 0)}${e.output.append ?? ""}` : tool.out);
			live.tools.set(e.toolCallId, tool);
			break;
		}
		case "tool_execution_end": live.tools.delete(e.toolCallId); break;
		case "task_failed": entries.push({ kind: "app.error", model: [{ role: "note", content: `task failed: ${e.message}` }] }); break;
		case "usage_changed": {
			const total = Object.values(e.usage?.models ?? {}).reduce((a, u) => ({ tokens: a.tokens + (u.totalTokens ?? 0), cost: a.cost + (u.cost?.total ?? 0) }), { tokens: 0, cost: 0 });
			$("usage").textContent = `${total.tokens} tok  $${total.cost.toFixed(3)}`;
			break;
		}
		case "inbox_update": if (e.items?.length) status(`running · ${e.items.length} queued`, "var(--warn)"); return paint();
		default: return;
	}
	paint();
	if (busy) status(boot.mode === "outpost" ? `running in ${boot.hands}` : "running locally", "var(--acc)");
	else {
		const m = model ?? boot.model;
		status(`${m.provider}/${m.modelId} · ${boot.mode === "outpost" ? `hands: ${boot.hands}` : `local: ${boot.cwd}`}`);
	}
}

function attach(next) {
	id = next;
	live.tools.clear(); live.text = ""; busy = false; entries = []; model = undefined;
	es?.close();
	es = new EventSource(q(`/api/stream?id=${id}`));
	es.onmessage = (m) => onEvent(JSON.parse(m.data));
	es.onerror = () => status("stream lost — retrying", "var(--warn)");
}

async function api(path, body) {
	const res = await fetch(q(path), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
	if (!res.ok) alert((await res.json().catch(() => ({}))).error ?? res.statusText);
	return res.json().catch(() => ({}));
}

function chips() {
	$("convs").replaceChildren(...boot.conversations.map((c) => Object.assign(el("button", "chip", `#${c}`), { onclick: () => attach(c), "aria-current": String(c === id) })));
}

$("new").onclick = async () => { const created = await api("/api/new", { model: $("model").value.trim() }); boot = await (await fetch(q("/api/boot"))).json(); boot.conversations = [created.id, ...boot.conversations.filter((c) => c !== created.id)]; chips(); attach(created.id); };
$("setmodel").onclick = async () => { if (id !== undefined && (await api("/api/model", { id, model: $("model").value.trim() })).ok) attach(id); };
$("reset").onclick = async () => id !== undefined && (await api("/api/reset", { id, handoff: "" }));
$("stop").onclick = async () => id !== undefined && (await api("/api/abort", { id }));
$("send").onclick = async () => {
	const text = $("input").value.trim();
	if (!text || id === undefined) return;
	$("input").value = "";
	await api("/api/input", { id, text, whenBusy: $("steer").checked ? "steer" : "follow-up" });
};
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });

(async () => {
	boot = await (await fetch(q("/api/boot"))).json();
	const known = await (await fetch(q("/api/models"))).json().catch(() => []);
	$("modelids").replaceChildren(...known.map((m) => Object.assign(document.createElement("option"), { value: m.id ?? m, textContent: `${m.id ?? m} · ${m.contextWindow ? (m.contextWindow >= 1e6 ? `${+(m.contextWindow / 1e6).toFixed(1)}M` : `${Math.round(m.contextWindow / 1000)}k`) : "?"}` })));
	chips();
	attach(boot.conversations[0] ?? (await api("/api/new", { model: $("model").value.trim() })).id);
	boot = await (await fetch(q("/api/boot"))).json();
	chips();
})();
</script>

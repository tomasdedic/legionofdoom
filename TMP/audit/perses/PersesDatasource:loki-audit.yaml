apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: loki-audit
  namespace: openshift-perses
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: perses-datasource
spec:
  client:
    kubernetesAuth:
      enable: true
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
  config:
    display:
      name: "Loki Audit Logs"
    default: false
    plugin:
      kind: "LokiDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: https://logging-loki-gateway-http.openshift-logging.svc.cluster.local:8080/api/logs/v1/audit
            secret: openshift-monitoring-secret
